name: Quality Gate

on:
  push:
    branches: [master]
  pull_request:


permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests + coverage 80%
        run: node --test --experimental-test-coverage --test-coverage-lines=80 tests/quality.test.mjs
      - name: Lint
        run: npx --yes eslint@9 js
      - name: Build
        run: node --check js/index.js
